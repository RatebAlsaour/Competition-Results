# بناء بدون إنترنت (يُضاف فوق docker-compose.yml):
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d --build
# يستخدمه scripts/deploy-docker-server.sh تلقائياً عندما لا يصل السيرفر إلى الإنترنت.
services:
  app:
    build:
      dockerfile: Dockerfile.offline
      target: app
  nginx:
    build:
      dockerfile: Dockerfile.offline
      target: nginx
