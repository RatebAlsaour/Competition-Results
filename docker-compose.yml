services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - competition-results

  app:
    build:
      context: .
      target: app
      args:
        APP_BUILD_BRANCH: ${APP_BUILD_BRANCH:-}
        APP_BUILD_COMMIT: ${APP_BUILD_COMMIT:-}
        APP_BUILD_COMMIT_DATE: ${APP_BUILD_COMMIT_DATE:-}
    image: competition-results-app:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
      # ملفات النتائج الثابتة (JSON): يكتبها التطبيق ويقدمها nginx مباشرة
      - results-data:/var/www/html/public/data
    networks:
      - competition-results

  nginx:
    build:
      context: .
      target: nginx
    image: competition-results-nginx:latest
    restart: unless-stopped
    ports:
      # يستمع على المضيف فقط؛ Nginx المضيف (مع SSL) يمرر الطلبات إليه
      - "127.0.0.1:${APP_HTTP_PORT:-8060}:80"
    depends_on:
      app:
        condition: service_started
    volumes:
      - results-data:/var/www/html/public/data:ro
    networks:
      - competition-results

volumes:
  mysql-data:
  storage-data:
  results-data:

networks:
  competition-results:
    driver: bridge
