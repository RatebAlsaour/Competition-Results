x-hardening: &hardening
  # منع تصعيد الصلاحيات داخل الحاوية + تدوير السجلات (لا يمتلئ القرص عند هجوم إغراق)
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  mysql:
    <<: *hardening
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - competition-results

  redis:
    <<: *hardening
    image: redis:7-alpine
    # اختيارية: تعمل فقط مع COMPOSE_PROFILES=redis (تحتاج إنترنت أول مرة لتنزيل الصورة)
    profiles: ["redis"]
    restart: unless-stopped
    # ذاكرة فقط للكاش والجلسات وعدادات تحديد المعدل (ليست بيانات دائمة)
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - competition-results

  app:
    <<: *hardening
    build:
      context: .
      target: app
      args:
        APP_BUILD_BRANCH: ${APP_BUILD_BRANCH:-}
        APP_BUILD_COMMIT: ${APP_BUILD_COMMIT:-}
        APP_BUILD_COMMIT_DATE: ${APP_BUILD_COMMIT_DATE:-}
        INSTALL_REDIS: ${INSTALL_REDIS:-false}
    image: competition-results-app:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    # الكاش والجلسات: database افتراضياً، أو redis عند تفعيله (CACHE_STORE و SESSION_DRIVER في .env.docker)
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/html/storage
      # ملفات النتائج الثابتة (JSON): يكتبها التطبيق ويقدمها nginx مباشرة
      - results-data:/var/www/html/public/data
    networks:
      - competition-results

  nginx:
    <<: *hardening
    build:
      context: .
      target: nginx
    image: competition-results-nginx:latest
    restart: unless-stopped
    ports:
      # يستمع على المضيف فقط؛ Nginx المضيف (مع SSL) يمرر الطلبات إليه
      - "127.0.0.1:${APP_HTTP_PORT:-8060}:80"
    depends_on:
      app:
        condition: service_started
    volumes:
      - results-data:/var/www/html/public/data:ro
    tmpfs:
      # نسخ صفحة البوابة المخزنة (micro-cache) — في الذاكرة
      - /var/cache/nginx/portal:size=64m
    networks:
      - competition-results

volumes:
  mysql-data:
  storage-data:
  results-data:

networks:
  competition-results:
    driver: bridge
