; PHP-FPM pool — نتائج الزوار ملفات ثابتة يقدمها nginx، فـ PHP يخدم صفحة البوابة ولوحة التحكم فقط.
; عدّل pm.max_children حسب ذاكرة السيرفر (تقريباً 40MB لكل عامل).
[www]
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000
