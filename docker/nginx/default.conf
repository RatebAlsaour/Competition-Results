# بوابة نتائج المسابقات — طبقات الكاش:
#   1. /data/*.json و /build/*  ملفات ثابتة يقدمها nginx مباشرة (بدون PHP) ويخزنها المتصفح
#   2. صفحة البوابة "/"         نسخة مخزنة 60 ثانية هنا (PHP مرة في الدقيقة بدل كل زائر)
#   3. داخل Laravel              Redis للكاش والجلسات وعدادات الحماية

# ---- عنوان IP الحقيقي للزائر ----
# الطلبات تصل من Nginx المضيف عبر شبكة Docker (172.16.0.0/12). نثق فقط بهذه الشبكة،
# ونأخذ IP الزائر من X-Real-IP الذي يضعه المضيف (لا يستطيع الزائر تزويره).
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Real-IP;

server_tokens off;

# ---- كاش صفحة البوابة (micro-cache) ----
fastcgi_cache_path /var/cache/nginx/portal levels=1:2 keys_zone=portal:10m max_size=50m inactive=10m use_temp_path=off;

# ---- كاش واصفات الملفات الثابتة (أقل قراءة للقرص تحت الضغط) ----
open_file_cache max=10000 inactive=60s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# ---- تحديد المعدل لكل زائر (الملفات الثابتة غير محدودة) ----
# صفحات PHP: 20 طلباً/ثانية لكل IP (مع هامش). مزودو الموبايل يضعون عدة مستخدمين خلف IP واحد، لذلك الحد متساهل.
limit_req_zone $binary_remote_addr zone=php_per_ip:20m rate=20r/s;
# تسجيل الدخول للوحة التحكم: 10 محاولات/دقيقة لكل IP
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 12M;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    limit_conn conn_per_ip 100;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # ---- نتائج المسابقات (ثابتة) ----
    location = /data/competitions.json {
        add_header Cache-Control "public, max-age=30, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/json;
        try_files $uri =404;
    }
    location ^~ /data/ {
        # كل تحديث يُنشر في مجلد نسخة جديد، لذلك هذه الملفات لا تتغير أبداً
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/json;
        access_log off;
        try_files $uri =404;
    }

    # ---- ملفات الواجهة (أسماؤها تحتوي بصمة) ----
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ---- صفحة البوابة: نسخة مخزنة 60 ثانية ----
    # الصفحة واحدة لكل الزوار (لا جلسة ولا كوكيز)، والمعاملات ?gov=... يقرؤها JavaScript،
    # لذلك لا تدخل في مفتاح الكاش. عند وصول آلاف الزوار معاً يمر طلب واحد فقط إلى PHP.
    location = / {
        limit_req zone=php_per_ip burst=40 nodelay;

        fastcgi_cache portal;
        fastcgi_cache_key "$http_x_forwarded_proto|$http_x_forwarded_host|$http_x_forwarded_port";
        fastcgi_cache_valid 200 60s;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        include /etc/nginx/snippets/app-fastcgi.conf;
    }

    # تسجيل الدخول يُمرَّر مباشرة إلى PHP مع حد أشد
    location = /api/admin/login {
        limit_req zone=admin_login burst=5 nodelay;
        include /etc/nginx/snippets/app-fastcgi.conf;
    }

    # ملفات حساسة يجب ألا تُطلب أبداً (فحص آلي شائع من المهاجمين)
    location ~* (\.(env|git|sql|sqlite|log|bak|ini|sh|lock|yml|yaml)$|/(vendor|storage|bootstrap|config|database|tests)/) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # أي ملف PHP غير index.php لا يُنفَّذ (يمنع تشغيل ملف مرفوع أو مزروع)
    location ~ \.php$ {
        return 404;
    }

    location = /index.php {
        limit_req zone=php_per_ip burst=40 nodelay;
        include /etc/nginx/snippets/app-fastcgi.conf;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
