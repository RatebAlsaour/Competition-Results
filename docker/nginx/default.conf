# بوابة نتائج المسابقات — نتائج الزوار ملفات JSON ثابتة في public/data يقدمها nginx مباشرة
# (بدون PHP ولا قاعدة بيانات)، فيتحمل الموقع مئات الطلبات في الثانية.

# حماية تسجيل الدخول للوحة التحكم (فوق تحديد المعدل الموجود في Laravel)
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 12M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # ---- نتائج المسابقات (ثابتة) ----
    location = /data/competitions.json {
        add_header Cache-Control "public, max-age=30, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/json;
        try_files $uri =404;
    }
    location ^~ /data/ {
        # كل تحديث يُنشر في مجلد نسخة جديد، لذلك هذه الملفات لا تتغير أبداً
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/json;
        access_log off;
        try_files $uri =404;
    }

    # ---- ملفات الواجهة (أسماؤها تحتوي بصمة) ----
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location = /api/admin/login {
        limit_req zone=admin_login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_read_timeout 300s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
